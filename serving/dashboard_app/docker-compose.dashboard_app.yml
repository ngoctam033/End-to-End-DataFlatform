services:
  analytics_dashboard:
    build:
      context: ../..
      dockerfile: serving/dashboard_app/Dockerfile
    container_name: analytics_dashboard
    environment:
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:-postgresql://analytics:analytics@data_warehouse_pg:5432/analytics_warehouse}
      DASHBOARD_PORT: 8501
    ports:
      - "${DASHBOARD_EXTERNAL_PORT:-8501}:8501"
    networks:
      - default

networks:
  default:
    name: end2end_data_network
    external: true
