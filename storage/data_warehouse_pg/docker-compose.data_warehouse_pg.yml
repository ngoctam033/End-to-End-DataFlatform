services:
  data_warehouse_pg:
    image: postgres:16
    container_name: data_warehouse_pg
    environment:
      POSTGRES_DB: analytics_warehouse
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "${DATA_WAREHOUSE_PG_EXTERNAL_PORT:-55433}:5432"
    volumes:
      - data-warehouse-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

volumes:
  data-warehouse-pg-data:

networks:
  default:
    name: end2end_data_network
    external: true
